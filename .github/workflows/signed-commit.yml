name: Prepare SSH-signed changes

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: "Existing branch containing the changes to sign (not main)"
        required: true
        type: string
      commit_message:
        description: "Message for the new signed commit"
        required: true
        type: string

permissions:
  contents: write

jobs:
  sign-changes:
    runs-on: ubuntu-latest
    steps:
      - name: Validate source branch
        env:
          SOURCE_BRANCH: ${{ inputs.source_branch }}
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_BRANCH" =~ ^[a-zA-Z0-9][a-zA-Z0-9._/-]*$ ||
                "$SOURCE_BRANCH" == "main" || "$SOURCE_BRANCH" == "master" ||
                "$SOURCE_BRANCH" == *..* || "$SOURCE_BRANCH" == */ ||
                "$SOURCE_BRANCH" == *//*
              ]]; then
            echo "::error::Enter an existing feature branch, not main."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Create signed branch from changes
        env:
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          COMMIT_MESSAGE: ${{ inputs.commit_message }}
          SIGNING_KEY: ${{ secrets.COMMIT_SIGNING_SSH_KEY }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$SIGNING_KEY" ]]; then
            echo "::error::COMMIT_SIGNING_SSH_KEY secret is missing."
            exit 1
          fi
          umask 077
          keyfile="$(mktemp)"
          patchfile="$(mktemp)"
          trap 'rm -f "$keyfile" "$patchfile"' EXIT
          printf '%s\n' "$SIGNING_KEY" > "$keyfile"
          chmod 600 "$keyfile"
          ssh-keygen -y -f "$keyfile" > /dev/null

          git fetch origin "refs/heads/$SOURCE_BRANCH:refs/remotes/origin/source-to-sign"
          git diff --binary origin/main...refs/remotes/origin/source-to-sign > "$patchfile"
          if [[ ! -s "$patchfile" ]]; then
            echo "::error::Source branch has no changes relative to main."
            exit 1
          fi

          signed_branch="signed/run-$RUN_ID"
          git switch -c "$signed_branch" origin/main
          git apply --index "$patchfile"
          git config user.name "ALeX400"
          git config user.email "10267988+ALeX400@users.noreply.github.com"
          git config gpg.format ssh
          git config user.signingkey "$keyfile"
          git config commit.gpgsign true
          git commit -m "$COMMIT_MESSAGE"
          git push origin "HEAD:refs/heads/$signed_branch"

          {
            echo "### Signed branch created"
            echo "Branch: \`$signed_branch\`"
            echo ""
            echo "Open a pull request from this branch into main:"
            echo "https://github.com/$GITHUB_REPOSITORY/compare/main...$signed_branch?expand=1"
            echo ""
            echo "Source branch remains unchanged. Delete it after the PR is merged."
          } >> "$GITHUB_STEP_SUMMARY"
